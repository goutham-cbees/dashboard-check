apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
jobs:
  deploy:
    steps:
      - uses: cloudbees-io/register-deployed-artifact@v2
        with:
          version: 1.0
          artifact-id: f93b1864-f2eb-42a0-84e2-6cb3a0cf7b10
          url: nexusoss.saas-preprod.beescloud.com/aspm-test:1.0
          target-environment: aspm-qa-test
  publish-evidence:
    steps:
      - name: publish evidence
        with:
          content: This is evidence
        uses: cloudbees-io/publish-evidence-item@v1
    needs: deploy
